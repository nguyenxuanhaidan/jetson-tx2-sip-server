; Asterisk PJSIP configuration for a local Jetson TX2 SIP demo
; Replace password placeholders before deployment.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ==================== device1 ====================

[device1]
type=endpoint
transport=transport-udp
context=internal
message_context=messages
disallow=all
allow=ulaw
auth=auth_device1
aors=device1
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth_device1]
type=auth
auth_type=userpass
username=device1
password=

[device1]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; ==================== device2 ====================

[device2]
type=endpoint
transport=transport-udp
context=internal
message_context=messages
disallow=all
allow=ulaw
auth=auth_device2
aors=device2
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth_device2]
type=auth
auth_type=userpass
username=device2
password=

[device2]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
