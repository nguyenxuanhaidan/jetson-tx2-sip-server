; Asterisk dialplan for Device 1 <-> Device 2

[internal]
; Voice/video calls. The called extension is also the PJSIP endpoint name.
exten => device1,1,Dial(PJSIP/device1)
exten => device1,n,Hangup()

exten => device2,1,Dial(PJSIP/device2)
exten => device2,n,Hangup()

[messages]
; Route SIP MESSAGE requests between the two local endpoints.
exten => device1,1,MessageSend(pjsip:device1)
exten => device1,n,Hangup()

exten => device2,1,MessageSend(pjsip:device2)
exten => device2,n,Hangup()
